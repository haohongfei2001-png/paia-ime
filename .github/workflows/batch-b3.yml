name: Batch B3 explicit settings and safe mode recovery
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: b3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  settings:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record machine and source
        run: |
          mkdir -p evidence/b3-run
          echo "PAIA_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          { git rev-parse HEAD; sw_vers; uname -a; swift --version; } | tee evidence/b3-run/environment.txt
      - name: Closed settings and failure injection (SIMULATED)
        run: |
          set -o pipefail
          swift test --filter SettingsCoreTests 2>&1 | tee evidence/b3-run/store-tests.txt
          swift build --product PAIANativeLab 2>&1 | tee evidence/b3-run/app-build.txt
      - name: Prepare exact research resources before native startup
        run: |
          set -o pipefail
          python3 Tools/audit-a1.py
          python3 Tools/audit-a2.py
          python3 Tools/prepare-a1.py | tee evidence/b3-run/a1-inputs.json
          python3 Tools/prepare-a2.py | tee evidence/b3-run/a2-inputs.json
          bash Tools/build-g01.sh 2>&1 | tee evidence/b3-run/extension-build.txt
          python3 Tools/prepare-b1.py | tee evidence/b3-run/b1-inputs.json
      - name: Fresh-process settings and real native controls (ENGINE_NATIVE and APPKIT_HOST)
        run: |
          set -o pipefail
          source .build/b1-env.sh
          export PAIA_B2_RESEARCH=1
          export PAIA_B2_STORE="$PWD/.build/b3-synthetic-personal"
          export PAIA_B3_STORE="$PWD/.build/b3-synthetic-settings"
          export PAIA_CAPTURE_B3_LAYOUT=1
          for stage in controls save restore restore_failed save_unknown overlay_disabled settings_corrupt settings_missing personal_corrupt; do
            PAIA_B3_TEST_STAGE="$stage" swift test --skip-build --filter SettingsNativeTests 2>&1 | tee "evidence/b3-run/native-$stage.txt"
          done
      - name: Preserve evidence only, never personal stores
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b3-evidence-${{ env.PAIA_SOURCE_SHA }}
          path: evidence/b3-run/
          retention-days: 14
