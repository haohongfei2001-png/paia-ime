name: Uninstalled IMK client integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: imk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Source, machine and official SDK contract
        run: |
          mkdir -p evidence/imk-run
          echo "PAIA_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          { git rev-parse HEAD; sw_vers; uname -a; swift --version; } | tee evidence/imk-run/environment.txt
          set -o pipefail
          sdk="$(xcrun --show-sdk-path)"
          { cat "$sdk/System/Library/Frameworks/InputMethodKit.framework/Headers/"*.h;
            cat "$sdk/System/Library/Frameworks/Carbon.framework/Frameworks/HIToolbox.framework/Headers/IMKInputSession.h";
          } | tee evidence/imk-run/official-sdk-headers.txt
      - name: Prepare immutable original fixture and engine
        run: |
          python3 Tools/audit-a1.py
          python3 Tools/audit-a2.py
          python3 Tools/audit-resources.py
          python3 Tools/prepare-a1.py | tee evidence/imk-run/inputs.json
      - name: Prepare existing unbundled research resources
        run: |
          set -o pipefail
          python3 Tools/prepare-a2.py | tee evidence/imk-run/research-inputs.json
          bash Tools/build-g01.sh 2>&1 | tee evidence/imk-run/extension-build.txt
          python3 Tools/prepare-b1.py | tee evidence/imk-run/schema-inputs.json
      - name: Bounded mixed-input native feasibility probe only
        run: |
          set -o pipefail
          bash Tools/probe-mixed.sh 2>&1 | tee evidence/imk-run/mixed-probe.txt
          grep -Fq 'MIXED_NATIVE_PROBE_TOTAL cases=98' evidence/imk-run/mixed-probe.txt
          grep -Fq 'MIXED_OWNER_API commits=20' evidence/imk-run/mixed-probe.txt
      - name: Compile uninstalled input-method bundle
        run: |
          set -o pipefail
          bash Tools/build-imk.sh 2>&1 | tee evidence/imk-run/build.txt
          cp .build/imk-bundle-manifest.json evidence/imk-run/
          cat .build/imk-bundle-manifest.json
      - name: Preflight only, no IMKServer construction
        run: |
          set -o pipefail
          env -u PAIA_RIME_LIBRARY -u PAIA_FIXTURE_DIR -u PAIA_DICTIONARY_REVISION .build/PAIAInputMethod.app/Contents/MacOS/PAIAInputMethod --preflight 2>&1 | tee evidence/imk-run/preflight.txt
      - name: Real engine and synthetic IMK protocol client
        run: |
          set -o pipefail
          source .build/a1-env.sh
          swift test --filter MixedDraftTests 2>&1 | tee evidence/imk-run/mixed-value-tests.txt
          grep -Fq 'Executed 10 tests, with 0 failures' evidence/imk-run/mixed-value-tests.txt
          swift test --skip-build --filter IMKProtocolTests 2>&1 | tee evidence/imk-run/protocol-tests.txt
          swift test --skip-build --filter IMKFixtureBasicsTests 2>&1 | tee evidence/imk-run/fixture-basics.txt
      - name: Offline public resource publication and precompiled startup recovery
        run: |
          set -o pipefail
          source .build/a1-env.sh
          python3 Tools/prepare-resource-tests.py | tee evidence/imk-run/resource-inputs.json
          source .build/resource-test-env.sh
          swift test --skip-build --filter ResourceCoreTests 2>&1 | tee evidence/imk-run/resource-core-tests.txt
          grep -Fq 'Executed 9 tests, with 0 failures' evidence/imk-run/resource-core-tests.txt
          swift test --skip-build --filter 'ResourceIMKTests.ResourceIMKTests/testHelperFailuresAreReapedBeforeNativeFallback' 2>&1 | tee evidence/imk-run/resource-helper-tests.txt
          grep -Fq 'RESOURCE_HELPER_FAULTS' evidence/imk-run/resource-helper-tests.txt
          swift test --skip-build --filter 'ResourceIMKTests.ResourceIMKTests/testNativeMissingSecondSchemaRejectsWholePublication' 2>&1 | tee evidence/imk-run/resource-all-schema-tests.txt
          grep -Fq 'RESOURCE_ALL_SCHEMA_NATIVE' evidence/imk-run/resource-all-schema-tests.txt
          for stage in current fallback semantic both late_failure active_publication after_publication; do
            PAIA_RESOURCE_STAGE="$stage" swift test --skip-build --filter 'ResourceIMKTests.ResourceIMKTests/testStartupAndRecoveryStage' 2>&1 | tee "evidence/imk-run/resource-$stage.txt"
            grep -Fq "RESOURCE_IMK_STAGE $stage" "evidence/imk-run/resource-$stage.txt"
            grep -Fq 'Executed 1 test, with 0 failures' "evidence/imk-run/resource-$stage.txt"
          done
          python3 Tools/check-resource-bundle-failure.py | tee evidence/imk-run/resource-bundle-negative.txt
      - name: Explicit bounded context and reviewed one-effect edits
        run: |
          set -o pipefail
          source .build/a1-env.sh
          export PAIA_CONTEXT_CAPTURE="$PWD/evidence/imk-run/context-review.png"
          export PAIA_CONTEXT_CAPTURE_TAIL="$PWD/evidence/imk-run/context-tail.png"
          swift test --skip-build --filter ContextCoreTests 2>&1 | tee evidence/imk-run/context-core-tests.txt
          grep -Fq 'Executed 7 tests, with 0 failures' evidence/imk-run/context-core-tests.txt
          swift test --skip-build --filter ContextIMKTests 2>&1 | tee evidence/imk-run/context-tests.txt
          grep -Fq 'Executed 12 tests, with 0 failures' evidence/imk-run/context-tests.txt
          grep -Fq 'IMK_CONTEXT_NATIVE ENGINE_NATIVE + APPKIT_HOST' evidence/imk-run/context-tests.txt
          python3 - <<'PY_CONTEXT_CAPTURE'
          import base64, pathlib
          for name, prefix in [('context-review.png', 'PAIA_IMK_CONTEXT_IMAGE'), ('context-tail.png', 'PAIA_IMK_CONTEXT_TAIL_IMAGE')]:
              encoded = base64.b64encode(pathlib.Path('evidence/imk-run', name).read_bytes()).decode()
              for index in range(0, len(encoded), 1800):
                  print(f'{prefix}_{index//1800}:{encoded[index:index+1800]}')
          PY_CONTEXT_CAPTURE
      - name: Mixed owner through real C ABI and Swift effect gate
        run: |
          set -o pipefail
          source .build/b1-env.sh
          swift test --skip-build --filter MixedInputTests.MixedInputTests 2>&1 | tee evidence/imk-run/mixed-swift-tests.txt
          grep -Fq 'Executed 10 tests, with 0 failures' evidence/imk-run/mixed-swift-tests.txt
          grep -Fq 'MIXED_SWIFT_NATIVE actual owner/shim/engine to one core effect' evidence/imk-run/mixed-swift-tests.txt
          grep -Fq 'MIXED_MODE_MATRIX native_commits=32 full_source_returns=32' evidence/imk-run/mixed-swift-tests.txt
          grep -Fq 'MIXED_CHAIN_NATIVE' evidence/imk-run/mixed-swift-tests.txt
          swift test --skip-build --filter MixedInputTests.MixedIMKTests 2>&1 | tee evidence/imk-run/mixed-imk-tests.txt
          grep -Fq 'Executed 7 tests, with 0 failures' evidence/imk-run/mixed-imk-tests.txt
          grep -Fq 'MIXED_IMK_NATIVE ENGINE_NATIVE + APPKIT_HOST' evidence/imk-run/mixed-imk-tests.txt
          grep -Fq 'MIXED_IMK_LONG 128 genuine suffix selections' evidence/imk-run/mixed-imk-tests.txt
      - name: Consolidated basic controls through real IMK driver
        run: |
          set -o pipefail
          source .build/b1-env.sh
          export PAIA_IMK_RESEARCH=1 PAIA_B2_RESEARCH=1
          export PAIA_B2_STORE="$PWD/.build/imk-synthetic-personal"
          export PAIA_B3_STORE="$PWD/.build/imk-synthetic-settings"
          for stage in controls save restore restore_failed verify_previous verify_published verify_unresolved authority_changed authority_oversized; do
            PAIA_IMK_BASIC_STAGE="$stage" swift test --skip-build --filter 'IMKBasicTests.IMKBasicTests/testResearchModesSettingsAndPersonalTermsThroughIMKDriver' 2>&1 | tee "evidence/imk-run/basics-$stage.txt"
            grep -Fq "IMK_BASIC_STAGE $stage ENGINE_NATIVE + APPKIT_HOST" "evidence/imk-run/basics-$stage.txt"
            grep -Fq "Executed 1 test, with 0 failures" "evidence/imk-run/basics-$stage.txt"
          done
      - name: Retained composition and constrained repair through actual IMK driver
        run: |
          set -o pipefail
          source .build/b1-env.sh
          export PAIA_REPAIR_CAPTURE="$PWD/evidence/imk-run/repair-review.png"
          export PAIA_REPAIR_CAPTURE_TAIL="$PWD/evidence/imk-run/repair-tail.png"
          swift test --skip-build --filter IMKRepairTests 2>&1 | tee evidence/imk-run/repair-tests.txt
          grep -Fq 'Executed 8 tests, with 0 failures' evidence/imk-run/repair-tests.txt
          grep -Fq 'IMK_REPAIR_NATIVE ENGINE_NATIVE + APPKIT_HOST' evidence/imk-run/repair-tests.txt
          python3 - <<'PY_CAPTURE'
          import base64, pathlib
          for name, prefix in [('repair-review.png', 'PAIA_IMK_REPAIR_IMAGE'), ('repair-tail.png', 'PAIA_IMK_REPAIR_TAIL_IMAGE')]:
              encoded = base64.b64encode(pathlib.Path('evidence/imk-run', name).read_bytes()).decode()
              for index in range(0, len(encoded), 1800):
                  print(f'{prefix}_{index//1800}:{encoded[index:index+1800]}')
          PY_CAPTURE
      - name: Preserve evidence including failed stages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imk-evidence-${{ env.PAIA_SOURCE_SHA }}
          path: evidence/imk-run/
          retention-days: 14
