# Artificial original fixture, using native OpenCC s2t with pinned conversion data.
schema:
  schema_id: paia_a2_filter
  name: PAIA A2 filter boundary fixture
  version: "1.0"
switches:
  - name: ascii_mode
    reset: 0
  - name: traditionalization
    reset: 1
engine:
  processors: [speller, selector, navigator, express_editor]
  segmentors: [abc_segmentor, fallback_segmentor]
  translators: [script_translator]
  filters: [simplifier@traditionalize, uniquifier]
menu:
  page_size: 5
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
translator:
  dictionary: paia_a2_filter
  enable_user_dict: false
  enable_sentence: true
traditionalize:
  option_name: traditionalization
  opencc_config: s2t.json
  tips: none
